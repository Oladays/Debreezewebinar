<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Watch the Webinar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
  rel="stylesheet"
>

<style>

/* =====================================================
   ROOT
===================================================== */

:root{

  --bg:#0F1117;
  --panel:#171A24;
  --field:#12141C;
  --line:#2A2E3D;
  --ink:#F2F0EB;
  --muted:#9095AC;
  --gold:#E8A33D;
  --teal:#3FBFAE;
  --red:#FF6B5E;

}


/* =====================================================
   RESET
===================================================== */

*{

  box-sizing:border-box;

  margin:0;

  padding:0;

}

html,
body{

  width:100%;
  height:100%;

}

body{

  background:var(--bg);

  color:var(--ink);

  font-family:'Inter',sans-serif;

  line-height:1.5;

  -webkit-font-smoothing:antialiased;

  display:flex;

  flex-direction:column;

  overflow:hidden;

}


/* =====================================================
   TOP BAR
===================================================== */

.topbar{

  border-bottom:1px solid var(--line);

  padding:16px 20px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  flex-shrink:0;

}

.brand{

  font-family:'Space Grotesk',sans-serif;

  font-weight:700;

  font-size:14.5px;

}

.brand span{

  color:var(--gold);

}


/* =====================================================
   LIVE
===================================================== */

.badge{

  display:inline-flex;

  align-items:center;

  gap:7px;

  font-family:'Space Grotesk',sans-serif;

  font-size:11.5px;

  font-weight:700;

  letter-spacing:.06em;

  text-transform:uppercase;

  color:var(--red);

}

.badge .dot{

  width:8px;

  height:8px;

  border-radius:50%;

  background:var(--red);

  box-shadow:
    0 0 0 3px rgba(255,107,94,.18);

  animation:livePulse 1.2s infinite;

}

@keyframes livePulse{

  0%,
  100%{

    opacity:1;

    transform:scale(1);

  }

  50%{

    opacity:.4;

    transform:scale(.85);

  }

}


/* =====================================================
   VIDEO
===================================================== */

.video-frame{

  position:relative;

  width:100%;

  padding-top:56.25%;

  background:#000;

  flex-shrink:0;

  overflow:hidden;

}

.video-frame iframe{

  position:absolute;

  top:0;

  left:0;

  width:100%;

  height:100%;

  border:0;

}


/* =====================================================
   DEBREEZE COVER
===================================================== */

/*
   Covers the date/name shown inside
   the original video.
*/

.video-brand-overlay{

  position:absolute;

  top:8px;

  left:10px;

  z-index:30;

  width:190px;

  height:56px;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#000;

  color:#F2F0EB;

  font-family:'Space Grotesk',sans-serif;

  font-size:16px;

  font-weight:700;

  letter-spacing:.08em;

  text-transform:uppercase;

  border-radius:5px;

  pointer-events:none;

  user-select:none;

}


/* =====================================================
   FULL VIDEO SHIELD
===================================================== */

/*
   The visitor cannot touch the YouTube iframe.

   This prevents YouTube's controls/interface
   from appearing when the video is touched.
*/

.video-touch-shield{

  position:absolute;

  inset:0;

  z-index:50;

  background:transparent;

  pointer-events:auto;

  touch-action:none;

  user-select:none;

  -webkit-user-select:none;

}


/* =====================================================
   WELCOME
===================================================== */

.meta-strip{

  display:flex;

  align-items:center;

  justify-content:flex-start;

  padding:12px 20px;

  border-bottom:1px solid var(--line);

  font-size:13px;

  color:var(--muted);

  flex-shrink:0;

}

.meta-strip strong{

  color:var(--ink);

}


/* =====================================================
   COMMENTS
===================================================== */

.comments-feed{

  flex:1;

  overflow-y:auto;

  overflow-x:hidden;

  padding:16px 20px;

  -webkit-overflow-scrolling:touch;

  scroll-behavior:smooth;

}


/* =====================================================
   COMMENT CARD
===================================================== */

.comment{

  display:flex;

  gap:12px;

  padding:12px 14px;

  background:var(--panel);

  border-radius:12px;

  margin-bottom:10px;

  max-width:92%;

  opacity:0;

  transform:translateY(10px);

  animation:commentIn .45s ease forwards;

}

@keyframes commentIn{

  from{

    opacity:0;

    transform:translateY(10px);

  }

  to{

    opacity:1;

    transform:translateY(0);

  }

}


/* =====================================================
   AVATAR
===================================================== */

.avatar{

  width:32px;

  height:32px;

  min-width:32px;

  border-radius:50%;

  background:
    linear-gradient(
      135deg,
      var(--teal),
      var(--gold)
    );

}


/* =====================================================
   COMMENT BODY
===================================================== */

.comment-body{

  flex:1;

  min-width:0;

}

.comment-name{

  font-weight:600;

  font-size:13.5px;

}

.comment-role{

  font-size:11.5px;

  color:var(--muted);

  margin-left:6px;

  font-weight:400;

}

.comment-text{

  font-size:14px;

  color:#C9CCDA;

  margin-top:3px;

  word-break:break-word;

}

.empty-note{

  font-size:13.5px;

  color:var(--muted);

  text-align:center;

  padding:32px 0;

}


/* =====================================================
   BOTTOM AREA
===================================================== */

.bottom-area{

  display:flex;

  gap:10px;

  padding:
    14px
    20px
    calc(14px + env(safe-area-inset-bottom));

  border-top:1px solid var(--line);

  background:var(--bg);

  flex-shrink:0;

}


/* =====================================================
   COMMENT INPUT
===================================================== */

.comment-input-wrap{

  flex:1;

  min-width:0;

}

.comment-form-input{

  width:100%;

  background:var(--field);

  border:1px solid var(--line);

  color:var(--ink);

  padding:14px 16px;

  border-radius:24px;

  font-size:14.5px;

  font-family:inherit;

}

.comment-form-input::placeholder{

  color:#5C6079;

}

.comment-form-input:focus{

  outline:2px solid var(--teal);

  outline-offset:1px;

  border-color:var(--teal);

}


/* =====================================================
   SEND
===================================================== */

.send-button{

  background:var(--gold);

  color:#1A1204;

  border:none;

  padding:0 22px;

  border-radius:24px;

  font-weight:700;

  font-size:14px;

  font-family:inherit;

  cursor:pointer;

  flex-shrink:0;

}

.send-button:active{

  transform:scale(.97);

}


/* =====================================================
   FINAL CTA
===================================================== */

.final-cta{

  display:none;

  width:100%;

  min-height:52px;

  align-items:center;

  justify-content:center;

  text-align:center;

  padding:13px 20px;

  border-radius:28px;

  background:var(--gold);

  color:#1A1204;

  text-decoration:none;

  font-family:'Space Grotesk',sans-serif;

  font-size:15px;

  font-weight:800;

  letter-spacing:.02em;

  animation:
    ctaPulse 1s infinite,
    ctaGlow 1.2s infinite;

}

.final-cta.show{

  display:flex;

}

@keyframes ctaPulse{

  0%,
  100%{

    transform:scale(1);

  }

  50%{

    transform:scale(1.035);

  }

}

@keyframes ctaGlow{

  0%,
  100%{

    box-shadow:
      0 0 0 rgba(232,163,61,0);

  }

  50%{

    box-shadow:
      0 0 22px rgba(232,163,61,.55);

  }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  .topbar{

    padding:14px 16px;

  }

  .video-frame{

    padding-top:56.25%;

  }

  .video-brand-overlay{

    width:185px;

    height:55px;

    font-size:15px;

  }

  .meta-strip{

    padding:11px 16px;

  }

  .comments-feed{

    padding:14px 16px;

  }

  .bottom-area{

    padding-left:16px;

    padding-right:16px;

  }

  .send-button{

    padding:0 18px;

  }

}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media(prefers-reduced-motion:reduce){

  *{

    animation:none !important;

    transition:none !important;

  }

}

</style>

</head>

<script>

/* =====================================================
   USER NAME
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const name =
  params.get('name');


if(name){

  const safeName =
    name
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;');

  document.getElementById(
    'welcomeNote'
  ).innerHTML =
    `Welcome, <strong>${safeName}</strong>`;

}



/* =====================================================
   VIDEO SETTINGS
===================================================== */

const YOUTUBE_VIDEO_ID =
  'AW4IqId5kdM';


/*
   This key belongs only to this webinar.

   The saved position survives:

   • Refresh
   • Closing/reopening the page
   • Minimising Chrome
   • Switching apps
   • Locking the phone
*/

const VIDEO_PROGRESS_KEY =
  'debreeze_webinar_AW4IqId5kdM_position';



let player = null;

let playerReady = false;

let videoStarted = false;

let videoFinished = false;

let lastAllowedTime = 0;

let resumePosition = 0;



/* =====================================================
   READ SAVED POSITION
===================================================== */

function getSavedVideoPosition(){

  try{

    const saved =
      localStorage.getItem(
        VIDEO_PROGRESS_KEY
      );


    if(
      saved === null ||
      saved === ''
    ){

      return 0;

    }


    const position =
      parseFloat(saved);


    if(
      Number.isFinite(position) &&
      position >= 0
    ){

      return position;

    }

  }
  catch(error){

    console.log(
      'Could not read saved position',
      error
    );

  }


  return 0;

}



/* =====================================================
   SAVE POSITION
===================================================== */

function saveVideoPosition(){

  if(
    !player ||
    !playerReady ||
    videoFinished
  ){

    return;

  }


  try{

    const currentTime =
      player.getCurrentTime();


    if(
      Number.isFinite(currentTime) &&
      currentTime >= 0
    ){

      localStorage.setItem(

        VIDEO_PROGRESS_KEY,

        String(currentTime)

      );


      lastAllowedTime =
        currentTime;

    }

  }
  catch(error){

    console.log(
      'Could not save position',
      error
    );

  }

}



/* =====================================================
   YOUTUBE API
===================================================== */

function onYouTubeIframeAPIReady(){

  player =
    new YT.Player(

      'youtubePlayer',

      {

        videoId:
          YOUTUBE_VIDEO_ID,

        playerVars:{

          /*
             Start automatically.
          */

          autoplay:1,

          /*
             Hide YouTube controls.
          */

          controls:0,

          /*
             Disable keyboard controls.
          */

          disablekb:1,

          /*
             No fullscreen button.
          */

          fs:0,

          /*
             Reduce related videos.
          */

          rel:0,

          /*
             Mobile inline playback.
          */

          playsinline:1,

          /*
             Reduced YouTube branding.
          */

          modestbranding:1,

          /*
             Hide annotations.
          */

          iv_load_policy:3,

          /*
             Use YouTube's privacy-enhanced host.
          */

          host:
            'https://www.youtube-nocookie.com'

        },

        events:{

          onReady:
            onPlayerReady,

          onStateChange:
            onPlayerStateChange

        }

      }

    );

}



/* =====================================================
   PLAYER READY
===================================================== */

function onPlayerReady(event){

  player =
    event.target;

  playerReady = true;


  /*
     IMPORTANT:

     Read the saved position now.

     This means REFRESH ALSO RESUMES.
  */

  resumePosition =
    getSavedVideoPosition();


  if(
    resumePosition > 2
  ){

    try{

      player.seekTo(

        resumePosition,

        true

      );


      lastAllowedTime =
        resumePosition;

    }
    catch(error){

      console.log(
        'Resume seek failed',
        error
      );

    }

  }


  /*
     Try autoplay.
  */

  try{

    player.unMute();

    player.setVolume(100);

    player.playVideo();

  }
  catch(error){

    console.log(
      'Autoplay was blocked',
      error
    );

  }


  /*
     Check position every 500ms.
  */

  setInterval(

    function(){

      if(
        !player ||
        !playerReady ||
        videoFinished
      ){

        return;

      }


      const state =
        player.getPlayerState();


      if(

        state ===
        YT.PlayerState.PLAYING

        ||

        state ===
        YT.PlayerState.PAUSED

      ){

        const currentTime =
          player.getCurrentTime();


        /*
           Prevent large seeking.

           Small natural movements are allowed.
        */

        if(videoStarted){

          const difference =
            currentTime -
            lastAllowedTime;


          if(

            difference > 2.5

            ||

            difference < -1.5

          ){

            player.seekTo(

              lastAllowedTime,

              true

            );

          }
          else{

            lastAllowedTime =
              currentTime;

          }

        }
        else{

          lastAllowedTime =
            currentTime;

        }


        /*
           SAVE POSITION.

           This happens continuously,
           including while watching.
        */

        saveVideoPosition();

      }

    },

    500

  );

}



/* =====================================================
   PLAYER STATE
===================================================== */

function onPlayerStateChange(event){


  /*
     PLAYING
  */

  if(

    event.data ===
    YT.PlayerState.PLAYING

  ){

    videoStarted = true;


    /*
       Keep sound enabled.
    */

    try{

      player.unMute();

      player.setVolume(100);

    }
    catch(error){}

  }



  /*
     PAUSED
  */

  if(

    event.data ===
    YT.PlayerState.PAUSED

  ){

    /*
       Save immediately.
    */

    saveVideoPosition();

  }



  /*
     ENDED
  */

  if(

    event.data ===
    YT.PlayerState.ENDED

  ){

    videoFinished = true;


    lastAllowedTime =
      player.getDuration();


    /*
       Keep the completed position saved.

       This means refresh after completion
       does NOT suddenly restart from zero.
    */

    try{

      localStorage.setItem(

        VIDEO_PROGRESS_KEY,

        String(
          player.getDuration()
        )

      );

    }
    catch(error){}


    /*
       Replace comment box with CTA.
    */

    showFinalCTA();


    /*
       Beep.
    */

    playBeep();

  }

}



/* =====================================================
   PAGE HIDDEN
===================================================== */

/*
   VERY IMPORTANT FOR MOBILE.

   When Chrome is minimised or the user
   switches to another app, save immediately.
*/

document.addEventListener(

  'visibilitychange',

  function(){

    if(

      document.visibilityState ===
      'hidden'

    ){

      saveVideoPosition();

    }

  }

);



/* =====================================================
   PAGE HIDDEN / CLOSED
===================================================== */

window.addEventListener(

  'pagehide',

  function(){

    saveVideoPosition();

  }

);


window.addEventListener(

  'beforeunload',

  function(){

    saveVideoPosition();

  }

);



/* =====================================================
   FINAL CTA
===================================================== */

function showFinalCTA(){

  const inputWrap =
    document.getElementById(
      'commentInputWrap'
    );


  const sendButton =
    document.getElementById(
      'commentBtn'
    );


  const finalCTA =
    document.getElementById(
      'finalCTA'
    );


  if(inputWrap){

    inputWrap.style.display =
      'none';

  }


  if(sendButton){

    sendButton.style.display =
      'none';

  }


  if(finalCTA){

    finalCTA.classList.add(
      'show'
    );

  }

}



/* =====================================================
   BEEP
===================================================== */

function playBeep(){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if(!AudioContext){

      return;

    }


    const audio =
      new AudioContext();


    const oscillator =
      audio.createOscillator();


    const gain =
      audio.createGain();


    oscillator.type =
      'sine';


    oscillator.frequency.value =
      880;


    gain.gain.setValueAtTime(

      0.001,

      audio.currentTime

    );


    gain.gain.exponentialRampToValueAtTime(

      0.15,

      audio.currentTime + 0.02

    );


    gain.gain.exponentialRampToValueAtTime(

      0.001,

      audio.currentTime + 0.35

    );


    oscillator.connect(gain);

    gain.connect(audio.destination);


    oscillator.start();


    oscillator.stop(

      audio.currentTime + 0.35

    );

  }
  catch(error){

    console.log(
      'Beep blocked',
      error
    );

  }

}



/* =====================================================
   LOAD YOUTUBE SCRIPT
===================================================== */

const youtubeScript =
  document.createElement(
    'script'
  );


youtubeScript.src =
  'https://www.youtube.com/iframe_api';


document.head.appendChild(
  youtubeScript
);



/* =====================================================
   COMMENTS
===================================================== */

const commentsFeed =
  document.getElementById(
    'commentsFeed'
  );


const commentInput =
  document.getElementById(
    'commentInput'
  );


/*
   NEW GOOGLE SHEET ID
*/

const GOOGLE_SHEET_ID =
  '17x9WaxFXhbhgCG4v_mJZJVheGa0F0515';



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(value || '')

    .replace(/&/g,'&amp;')

    .replace(/</g,'&lt;')

    .replace(/>/g,'&gt;')

    .replace(/"/g,'&quot;')

    .replace(/'/g,'&#039;');

}



/* =====================================================
   ADD COMMENT
===================================================== */

function addComment(

  displayName,

  text,

  role='Attendee'

){

  if(
    !text ||
    !String(text).trim()
  ){

    return;

  }


  const emptyNote =
    document.getElementById(
      'emptyNote'
    );


  if(emptyNote){

    emptyNote.remove();

  }


  const element =
    document.createElement(
      'div'
    );


  element.className =
    'comment';


  element.innerHTML = `

    <div class="avatar"></div>

    <div class="comment-body">

      <div class="comment-name">

        ${escapeHTML(displayName)}

        <span class="comment-role">

          ${escapeHTML(role)}

        </span>

      </div>

      <p class="comment-text"></p>

    </div>

  `;


  /*
     Insert the REAL comment.

     No timestamp.
     No time.
     No date.
  */

  element.querySelector(
    '.comment-text'
  ).textContent =
    String(text);


  commentsFeed.appendChild(
    element
  );


  /*
     Keep newest comment visible.
  */

  requestAnimationFrame(

    function(){

      commentsFeed.scrollTo({

        top:
          commentsFeed.scrollHeight,

        behavior:
          'smooth'

      });

    }

  );

}



/* =====================================================
   GET CELL VALUE
===================================================== */

function getCellValue(

  cells,

  index

){

  if(
    index === -1 ||
    !cells[index] ||
    cells[index].v === undefined ||
    cells[index].v === null
  ){

    return '';

  }


  return String(
    cells[index].v
  ).trim();

}



/* =====================================================
   FIND COLUMN
===================================================== */

function findColumn(

  headers,

  possibleNames

){

  return headers.findIndex(

    function(header){

      const clean =
        String(header || '')
          .trim()
          .toLowerCase()
          .replace(/\s+/g,' ');


      return possibleNames.includes(
        clean
      );

    }

  );

}



/* =====================================================
   LOAD COMMENTS FROM SHEET
===================================================== */

async function loadComments(){

  try{

    /*
       GViz endpoint.

       tq=select * ensures we retrieve
       every column instead of accidentally
       dropping the comment column.
    */

    const url =
      `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:json&headers=1&tq=${encodeURIComponent('select *')}`;


    const response =
      await fetch(

        url,

        {
          cache:'no-store'
        }

      );


    if(!response.ok){

      throw new Error(
        'Google Sheet request failed'
      );

    }


    const raw =
      await response.text();


    /*
       Extract Google's JSON wrapper.
    */

    const start =
      raw.indexOf('{');


    const end =
      raw.lastIndexOf('}');


    if(
      start === -1 ||
      end === -1
    ){

      throw new Error(
        'Google Sheet returned invalid data'
      );

    }


    const json =
      JSON.parse(

        raw.substring(

          start,

          end + 1

        )

      );


    if(
      !json.table
    ){

      throw new Error(
        'Google Sheet table missing'
      );

    }


    const columns =
      json.table.cols || [];


    const rows =
      json.table.rows || [];


    /*
       Read column names.
    */

    const headers =
      columns.map(

        function(column){

          return String(
            column.label || ''
          )
          .trim()
          .toLowerCase();

        }

      );


    console.log(
      'Google Sheet columns:',
      headers
    );


    /*
       Find NAME.

       Supports:

       Name
       name
       Username
       User
       Full Name
    */

    let nameIndex =
      findColumn(

        headers,

        [

          'name',

          'username',

          'user',

          'full name',

          'fullname',

          'display name'

        ]

      );


    /*
       Find COMMENT.

       Supports many common names.
    */

    let commentIndex =
      findColumn(

        headers,

        [

          'comment',

          'comments',

          'comment text',

          'message',

          'text',

          'response',

          'reply'

        ]

      );


    /*
       Find timestamp.

       THIS COLUMN WILL NEVER BE SHOWN.
    */

    const timestampIndex =
      findColumn(

        headers,

        [

          'timestamp',

          'time',

          'date',

          'datetime',

          'date/time',

          'submitted at',

          'submission time'

        ]

      );


    /*
       Standard Google Form Sheet:

       Timestamp | Name | Comment

       If headers weren't detected,
       force the correct positions.
    */

    if(

      nameIndex === -1 &&

      timestampIndex === 0 &&

      columns.length >= 3

    ){

      nameIndex = 1;

    }


    if(

      commentIndex === -1 &&

      timestampIndex === 0 &&

      columns.length >= 3

    ){

      commentIndex = 2;

    }


    /*
       Another fallback:

       Name | Comment
    */

    if(

      nameIndex === -1 &&

      columns.length >= 2

    ){

      nameIndex = 0;

    }


    if(

      commentIndex === -1 &&

      columns.length >= 2

    ){

      /*
         If name is column 0,
         comment is column 1.

         If timestamp is column 0,
         this case won't be used.
      */

      if(
        nameIndex === 0
      ){

        commentIndex = 1;

      }

    }


    console.log(
      'Name column:',
      nameIndex
    );


    console.log(
      'Comment column:',
      commentIndex
    );


    console.log(
      'Timestamp column:',
      timestampIndex
    );


    /*
       If we still don't have
       a comment column, stop safely.
    */

    if(
      commentIndex === -1
    ){

      throw new Error(
        'Could not find Comment column in Google Sheet'
      );

    }


    /*
       Build queue.
    */

    const comments = [];


    rows.forEach(

      function(row){

        const cells =
          row.c || [];


        /*
           NAME

           Never use timestamp.
        */

        let displayName =
          getCellValue(

            cells,

            nameIndex

          );


        if(!displayName){

          displayName =
            'Attendee';

        }


        /*
           COMMENT

           This is the actual message.
        */

        const commentText =
          getCellValue(

            cells,

            commentIndex

          );


        /*
           Only add rows containing
           actual comments.
        */

        if(
          commentText
        ){

          comments.push({

            name:
              displayName,

            text:
              commentText

          });

        }

      }

    );


    console.log(
      'Comments loaded:',
      comments.length
    );


    /*
       Show comments ONE BY ONE.
    */

    let currentIndex = 0;


    function showNextComment(){

      if(

        currentIndex >=
        comments.length

      ){

        return;

      }


      const current =
        comments[currentIndex];


      addComment(

        current.name,

        current.text,

        'Attendee'

      );


      currentIndex++;


      /*
         2.5 seconds between comments.
      */

      setTimeout(

        showNextComment,

        2500

      );

    }


    /*
       Start after page loads.
    */

    if(
      comments.length > 0
    ){

      setTimeout(

        showNextComment,

        700

      );

    }
    else{

      console.log(
        'No comments found in the sheet.'
      );

    }

  }
  catch(error){

    console.error(
      'COMMENTS ERROR:',
      error
    );

  }

}



/* =====================================================
   START COMMENTS
===================================================== */

loadComments();



/* =====================================================
   USER COMMENT
===================================================== */

function postComment(){

  const text =
    commentInput.value.trim();


  if(!text){

    return;

  }


  const displayName =
    name

      ? name.split(' ')[0]

      : 'You';


  /*
     Local comment.

     No timestamp.
  */

  addComment(

    displayName,

    text,

    'Attendee'

  );


  commentInput.value = '';


  commentInput.focus();

}



/* =====================================================
   SEND
===================================================== */

document
  .getElementById(
    'commentBtn'
  )
  .addEventListener(

    'click',

    postComment

  );



/* =====================================================
   ENTER
===================================================== */

commentInput.addEventListener(

  'keydown',

  function(event){

    if(
      event.key === 'Enter'
    ){

      event.preventDefault();

      postComment();

    }

  }

);

</script>
