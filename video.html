<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Watch the Webinar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
  rel="stylesheet"
>

<style>

:root{
  --bg:#0F1117;
  --panel:#171A24;
  --field:#12141C;
  --line:#2A2E3D;
  --ink:#F2F0EB;
  --muted:#9095AC;
  --gold:#E8A33D;
  --teal:#3FBFAE;
  --red:#FF6B5E;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  height:100%;
}

body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;

  display:flex;
  flex-direction:column;

  overflow:hidden;
}

h1,
.brand,
.badge{
  font-family:'Space Grotesk',sans-serif;
}


/* =====================================================
   TOP BAR
===================================================== */

.topbar{
  border-bottom:1px solid var(--line);

  padding:16px 20px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  flex-shrink:0;
}

.brand{
  font-weight:700;
  font-size:14.5px;
}

.brand span{
  color:var(--gold);
}


/* =====================================================
   LIVE BADGE
===================================================== */

.badge{
  display:inline-flex;
  align-items:center;
  gap:7px;

  font-size:11.5px;
  font-weight:700;

  letter-spacing:.06em;
  text-transform:uppercase;

  color:var(--red);
}

.badge .dot{
  width:8px;
  height:8px;

  border-radius:50%;

  background:var(--red);

  box-shadow:
    0 0 0 3px rgba(255,107,94,.18);

  animation:pulse 1.2s infinite;
}

@keyframes pulse{

  0%,
  100%{
    opacity:1;
    transform:scale(1);
  }

  50%{
    opacity:.4;
    transform:scale(.85);
  }

}


/* =====================================================
   VIDEO
===================================================== */

.video-frame{
  position:relative;

  width:100%;

  padding-top:56.25%;

  background:#000;

  flex-shrink:0;

  overflow:hidden;
}

.video-frame iframe{
  position:absolute;

  top:0;
  left:0;

  width:100%;
  height:100%;

  border:0;
}


/* =====================================================
   DEBREEZE COVER
===================================================== */

.video-brand-overlay{

  position:absolute;

  top:9px;
  left:12px;

  width:215px;
  height:62px;

  z-index:30;

  display:flex;

  align-items:center;
  justify-content:center;

  background:#000;

  color:#F2F0EB;

  font-family:'Space Grotesk',sans-serif;

  font-size:18px;

  font-weight:700;

  letter-spacing:.08em;

  text-transform:uppercase;

  border-radius:5px;

  box-shadow:
    0 2px 10px rgba(0,0,0,.45);

  pointer-events:none;

  user-select:none;
}


/* =====================================================
   VIDEO TOUCH SHIELD
===================================================== */

.video-touch-shield{

  position:absolute;

  inset:0;

  z-index:40;

  background:transparent;

  pointer-events:auto;

  touch-action:none;

  user-select:none;
}


/* =====================================================
   WELCOME AREA
===================================================== */

.meta-strip{

  display:flex;

  justify-content:flex-start;
  align-items:center;

  padding:12px 20px;

  border-bottom:1px solid var(--line);

  font-size:13px;

  color:var(--muted);

  flex-shrink:0;
}

.meta-strip strong{
  color:var(--ink);
}


/* =====================================================
   COMMENTS FEED
===================================================== */

.comments-feed{

  flex:1;

  overflow-y:auto;

  padding:16px 20px;

  -webkit-overflow-scrolling:touch;

  scroll-behavior:smooth;
}


/* =====================================================
   COMMENT CARD
===================================================== */

.comment{

  display:flex;

  gap:12px;

  padding:12px 14px;

  background:var(--panel);

  border-radius:12px;

  margin-bottom:10px;

  max-width:92%;

  opacity:0;

  transform:translateY(10px);

  animation:commentAppear .45s ease forwards;
}

@keyframes commentAppear{

  from{
    opacity:0;
    transform:translateY(10px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

.avatar{

  width:32px;
  height:32px;

  border-radius:50%;

  background:
    linear-gradient(
      135deg,
      var(--teal),
      var(--gold)
    );

  flex-shrink:0;
}

.comment-body{

  flex:1;

  min-width:0;
}

.comment-name{

  font-weight:600;

  font-size:13.5px;
}

.comment-role{

  font-size:11.5px;

  color:var(--muted);

  margin-left:6px;

  font-weight:400;
}

.comment-text{

  font-size:14px;

  color:#C9CCDA;

  margin-top:3px;

  word-wrap:break-word;
}

.empty-note{

  font-size:13.5px;

  color:var(--muted);

  text-align:center;

  padding:32px 0;
}


/* =====================================================
   BOTTOM COMMENT / CTA AREA
===================================================== */

.bottom-area{

  display:flex;

  gap:10px;

  padding:
    14px
    20px
    calc(14px + env(safe-area-inset-bottom));

  border-top:1px solid var(--line);

  background:var(--bg);

  flex-shrink:0;
}


/* =====================================================
   COMMENT INPUT
===================================================== */

.comment-input-wrap{

  display:flex;

  flex:1;

  min-width:0;
}

.comment-form-input{

  width:100%;

  background:var(--field);

  border:1px solid var(--line);

  color:var(--ink);

  padding:14px 16px;

  border-radius:24px;

  font-size:14.5px;

  font-family:inherit;
}

.comment-form-input::placeholder{

  color:#5C6079;
}

.comment-form-input:focus{

  outline:2px solid var(--teal);

  outline-offset:1px;

  border-color:var(--teal);
}


/* =====================================================
   SEND BUTTON
===================================================== */

.send-button{

  background:var(--gold);

  color:#1A1204;

  border:none;

  padding:0 22px;

  border-radius:24px;

  font-weight:700;

  font-size:14px;

  font-family:inherit;

  cursor:pointer;

  flex-shrink:0;
}

.send-button:active{

  transform:scale(.97);
}


/* =====================================================
   FINAL CTA
===================================================== */

.final-cta{

  display:none;

  width:100%;

  min-height:52px;

  align-items:center;

  justify-content:center;

  text-align:center;

  padding:13px 20px;

  border-radius:28px;

  background:var(--gold);

  color:#1A1204;

  text-decoration:none;

  font-family:'Space Grotesk',sans-serif;

  font-size:15px;

  font-weight:800;

  letter-spacing:.02em;

  box-shadow:
    0 0 0 rgba(232,163,61,0);
}

.final-cta.show{

  display:flex;

  animation:
    ctaPulse 1s infinite,
    ctaGlow 1.2s infinite;
}

@keyframes ctaPulse{

  0%,
  100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.035);
  }

}

@keyframes ctaGlow{

  0%,
  100%{
    box-shadow:
      0 0 0 rgba(232,163,61,0);
  }

  50%{
    box-shadow:
      0 0 22px rgba(232,163,61,.55);
  }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  .topbar{
    padding:14px 16px;
  }

  .video-frame{
    padding-top:56.25%;
  }

  .video-brand-overlay{

    top:8px;
    left:10px;

    width:185px;
    height:55px;

    font-size:15px;
  }

  .meta-strip{
    padding:11px 16px;
  }

  .comments-feed{
    padding:14px 16px;
  }

  .bottom-area{

    padding-left:16px;
    padding-right:16px;
  }

  .send-button{
    padding:0 18px;
  }

}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media(prefers-reduced-motion:reduce){

  *{
    animation:none !important;
    transition:none !important;
  }

}

</style>

<script>


/* =====================================================
   NAME FROM REGISTRATION URL
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const name =
  params.get('name');


if(name){

  const safeName =
    name
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;');

  document.getElementById(
    'welcomeNote'
  ).innerHTML =
    `Welcome, <strong>${safeName}</strong>`;

}



/* =====================================================
   YOUTUBE PLAYER
===================================================== */

let player = null;

let lastAllowedTime = 0;

let videoStarted = false;

let videoFinished = false;

let playerReady = false;


/*
   Unique storage key for this webinar.

   This means the browser remembers the
   position for this specific video.
*/

const VIDEO_PROGRESS_KEY =
  'debreeze_webinar_AW4IqId5kdM_progress';


const YOUTUBE_VIDEO_ID =
  'AW4IqId5kdM';



/* =====================================================
   GET SAVED VIDEO POSITION
===================================================== */

function getSavedPosition(){

  try{

    const saved =
      localStorage.getItem(
        VIDEO_PROGRESS_KEY
      );

    if(!saved){

      return 0;

    }

    const position =
      parseFloat(saved);

    if(
      Number.isFinite(position) &&
      position > 0
    ){

      return position;

    }

  }
  catch(error){

    console.log(
      'Could not read saved position:',
      error
    );

  }

  return 0;

}



/* =====================================================
   SAVE VIDEO POSITION
===================================================== */

function saveVideoPosition(){

  if(
    !player ||
    !playerReady ||
    videoFinished
  ){

    return;

  }

  try{

    const currentTime =
      player.getCurrentTime();


    if(
      Number.isFinite(currentTime) &&
      currentTime >= 0
    ){

      localStorage.setItem(

        VIDEO_PROGRESS_KEY,

        String(currentTime)

      );

      lastAllowedTime =
        currentTime;

    }

  }
  catch(error){

    console.log(
      'Could not save video position:',
      error
    );

  }

}



/* =====================================================
   YOUTUBE API READY
===================================================== */

function onYouTubeIframeAPIReady(){

  player =
    new YT.Player(

      'youtubePlayer',

      {

        videoId:
          YOUTUBE_VIDEO_ID,

        playerVars:{

          autoplay:1,

          controls:0,

          disablekb:1,

          fs:0,

          rel:0,

          playsinline:1,

          modestbranding:1,

          iv_load_policy:3

        },

        events:{

          onReady:
            onPlayerReady,

          onStateChange:
            onPlayerStateChange

        }

      }

    );

}



/* =====================================================
   PLAYER READY
===================================================== */

function onPlayerReady(event){

  player =
    event.target;

  playerReady = true;


  /*
     Get the saved position BEFORE playing.

     This is the important part that prevents
     the video from starting from zero again.
  */

  const savedPosition =
    getSavedPosition();


  if(savedPosition > 0){

    try{

      player.seekTo(
        savedPosition,
        true
      );

      lastAllowedTime =
        savedPosition;

    }
    catch(error){

      console.log(
        'Could not resume video:',
        error
      );

    }

  }


  /*
     Try to autoplay with sound.
  */

  try{

    player.unMute();

    player.setVolume(100);

    player.playVideo();

  }
  catch(error){

    console.log(
      'Autoplay with sound was blocked:',
      error
    );

  }


  /*
     Save the position every second.

     So if the visitor leaves,
     the latest position is already stored.
  */

  setInterval(

    function(){

      if(
        !player ||
        !playerReady ||
        videoFinished
      ){

        return;

      }


      const state =
        player.getPlayerState();


      if(

        state ===
        YT.PlayerState.PLAYING

        ||

        state ===
        YT.PlayerState.PAUSED

      ){

        const currentTime =
          player.getCurrentTime();


        /*
           Protect against seeking.
        */

        if(videoStarted){

          const difference =
            currentTime -
            lastAllowedTime;


          if(

            difference > 2.5

            ||

            difference < -1.5

          ){

            player.seekTo(

              lastAllowedTime,

              true

            );

          }

          else{

            lastAllowedTime =
              currentTime;

          }

        }
        else{

          lastAllowedTime =
            currentTime;

        }


        /*
           Save current position.
        */

        saveVideoPosition();

      }

    },

    1000

  );

}



/* =====================================================
   PLAYER STATE CHANGE
===================================================== */

function onPlayerStateChange(event){


  /*
     VIDEO PLAYING
  */

  if(

    event.data ===
    YT.PlayerState.PLAYING

  ){

    videoStarted = true;


    /*
       Keep audio enabled.
    */

    try{

      player.unMute();

      player.setVolume(100);

    }
    catch(error){}

  }



  /*
     VIDEO PAUSED
  */

  if(

    event.data ===
    YT.PlayerState.PAUSED

  ){

    /*
       Immediately save the exact
       point where the video stopped.
    */

    saveVideoPosition();

  }



  /*
     VIDEO ENDED
  */

  if(

    event.data ===
    YT.PlayerState.ENDED

  ){

    videoFinished = true;

    lastAllowedTime =
      player.getDuration();


    /*
       Video is finished.

       Remove saved progress because
       the visitor has completed the webinar.
    */

    try{

      localStorage.removeItem(
        VIDEO_PROGRESS_KEY
      );

    }
    catch(error){}


    /*
       Replace the comment input area
       with the CTA.
    */

    showFinalCTA();


    /*
       Beep.
    */

    playBeep();

  }

}



/* =====================================================
   SHOW FINAL CTA
===================================================== */

function showFinalCTA(){

  const inputWrap =
    document.getElementById(
      'commentInputWrap'
    );

  const sendButton =
    document.getElementById(
      'commentBtn'
    );

  const finalCTA =
    document.getElementById(
      'finalCTA'
    );


  /*
     Remove comment input.
  */

  if(inputWrap){

    inputWrap.style.display =
      'none';

  }


  /*
     Remove Send button.
  */

  if(sendButton){

    sendButton.style.display =
      'none';

  }


  /*
     Show CTA in exactly
     the same bottom area.
  */

  if(finalCTA){

    finalCTA.classList.add(
      'show'
    );

  }

}



/* =====================================================
   BEEP
===================================================== */

function playBeep(){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if(!AudioContext){

      return;

    }


    const audio =
      new AudioContext();


    const oscillator =
      audio.createOscillator();


    const gain =
      audio.createGain();


    oscillator.type =
      'sine';


    oscillator.frequency.value =
      880;


    gain.gain.setValueAtTime(

      0.001,

      audio.currentTime

    );


    gain.gain.exponentialRampToValueAtTime(

      0.15,

      audio.currentTime + 0.02

    );


    gain.gain.exponentialRampToValueAtTime(

      0.001,

      audio.currentTime + 0.35

    );


    oscillator.connect(gain);

    gain.connect(audio.destination);


    oscillator.start();


    oscillator.stop(

      audio.currentTime + 0.35

    );

  }
  catch(error){

    console.log(
      'Beep blocked:',
      error
    );

  }

}



/* =====================================================
   SAVE WHEN PAGE IS HIDDEN
===================================================== */

/*
   This is specifically for:

   - Minimising Chrome
   - Switching apps
   - Locking the phone
   - Opening another tab
   - Leaving the page

   We save the exact current position
   before the browser puts the page to sleep.
*/

document.addEventListener(

  'visibilitychange',

  function(){

    if(
      document.visibilityState ===
      'hidden'
    ){

      saveVideoPosition();

    }

  }

);



/* =====================================================
   SAVE BEFORE PAGE CLOSES
===================================================== */

window.addEventListener(

  'pagehide',

  function(){

    saveVideoPosition();

  }

);

window.addEventListener(

  'beforeunload',

  function(){

    saveVideoPosition();

  }

);



/* =====================================================
   LOAD YOUTUBE API
===================================================== */

const youtubeScript =
  document.createElement(
    'script'
  );

youtubeScript.src =
  'https://www.youtube.com/iframe_api';

document.head.appendChild(
  youtubeScript
);



/* =====================================================
   COMMENTS
===================================================== */

const commentsFeed =
  document.getElementById(
    'commentsFeed'
  );

const commentInput =
  document.getElementById(
    'commentInput'
  );


/*
   NEW GOOGLE SHEET
*/

const GOOGLE_SHEET_ID =
  '17x9WaxFXhbhgCG4v_mJZJVheGa0F0515';



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(value || '')

    .replace(/&/g,'&amp;')

    .replace(/</g,'&lt;')

    .replace(/>/g,'&gt;')

    .replace(/"/g,'&quot;')

    .replace(/'/g,'&#039;');

}



/* =====================================================
   ADD COMMENT
===================================================== */

function addComment(

  displayName,

  text,

  role='Attendee'

){

  if(
    !text ||
    !text.trim()
  ){

    return;

  }


  const emptyNote =
    document.getElementById(
      'emptyNote'
    );


  if(emptyNote){

    emptyNote.remove();

  }


  const el =
    document.createElement(
      'div'
    );


  el.className =
    'comment';


  el.innerHTML = `

    <div class="avatar"></div>

    <div class="comment-body">

      <div class="comment-name">

        ${escapeHTML(displayName)}

        <span class="comment-role">

          ${escapeHTML(role)}

        </span>

      </div>

      <p class="comment-text"></p>

    </div>

  `;


  /*
     Actual comment text.
     
     No timestamp.
  */

  el.querySelector(
    '.comment-text'
  ).textContent =
    text;


  commentsFeed.appendChild(
    el
  );


  /*
     Scroll to newest comment.
  */

  requestAnimationFrame(

    function(){

      commentsFeed.scrollTo({

        top:
          commentsFeed.scrollHeight,

        behavior:
          'smooth'

      });

    }

  );

}



/* =====================================================
   LOAD COMMENTS
===================================================== */

async function loadComments(){

  try{

    const url =
      `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:json`;


    const response =
      await fetch(url);


    if(!response.ok){

      throw new Error(
        'Unable to load comments'
      );

    }


    const raw =
      await response.text();


    const start =
      raw.indexOf('{');


    const end =
      raw.lastIndexOf('}');


    if(
      start === -1 ||
      end === -1
    ){

      throw new Error(
        'Invalid Google Sheet response'
      );

    }


    const jsonText =
      raw.substring(

        start,

        end + 1

      );


    const data =
      JSON.parse(
        jsonText
      );


    const rows =
      data.table.rows || [];


    const columns =
      data.table.cols || [];


    /*
       Read sheet headers.
    */

    const headers =
      columns.map(

        function(col){

          return String(
            col.label || ''
          )
          .trim()
          .toLowerCase();

        }

      );


    /*
       Find NAME column.
    */

    let nameIndex =
      headers.findIndex(

        function(header){

          return(

            header === 'name'

            ||

            header === 'username'

            ||

            header === 'user'

            ||

            header === 'full name'

            ||

            header === 'fullname'

          );

        }

      );


    /*
       Find COMMENT column.
    */

    let commentIndex =
      headers.findIndex(

        function(header){

          return(

            header === 'comment'

            ||

            header === 'comments'

            ||

            header === 'message'

            ||

            header === 'text'

            ||

            header === 'comment text'

          );

        }

      );


    /*
       Find timestamp.

       This column is NEVER displayed.
    */

    const timestampIndex =
      headers.findIndex(

        function(header){

          return(

            header === 'timestamp'

            ||

            header === 'time'

            ||

            header === 'date'

            ||

            header === 'datetime'

            ||

            header === 'date/time'

          );

        }

      );


    /*
       If there is:

       Timestamp | Name | Comment

       use:

       Name = column B
       Comment = column C
    */

    if(nameIndex === -1){

      if(
        timestampIndex === 0 &&
        columns.length >= 3
      ){

        nameIndex = 1;

      }
      else if(
        columns.length >= 2
      ){

        nameIndex = 0;

      }

    }


    if(commentIndex === -1){

      if(
        timestampIndex === 0 &&
        columns.length >= 3
      ){

        commentIndex = 2;

      }
      else if(
        nameIndex === 0 &&
        columns.length >= 2
      ){

        commentIndex = 1;

      }

    }


    /*
       Build comment queue.
    */

    const commentQueue = [];


    rows.forEach(

      function(row){

        const cells =
          row.c || [];


        let displayName =
          'Attendee';


        if(

          nameIndex !== -1 &&

          cells[nameIndex] &&

          cells[nameIndex].v !== undefined &&

          cells[nameIndex].v !== null

        ){

          displayName =
            String(
              cells[nameIndex].v
            ).trim();

        }


        let commentText =
          '';


        if(

          commentIndex !== -1 &&

          cells[commentIndex] &&

          cells[commentIndex].v !== undefined &&

          cells[commentIndex].v !== null

        ){

          commentText =
            String(
              cells[commentIndex].v
            ).trim();

        }


        /*
           Only comments with actual text
           are shown.
        */

        if(commentText){

          commentQueue.push({

            name:
              displayName || 'Attendee',

            text:
              commentText

          });

        }

      }

    );


    /*
       Show comments one by one.
    */

    let index = 0;


    function showNextComment(){

      if(
        index >=
        commentQueue.length
      ){

        return;

      }


      const comment =
        commentQueue[index];


      addComment(

        comment.name,

        comment.text,

        'Attendee'

      );


      index++;


      /*
         Next comment after 2.5 seconds.
      */

      setTimeout(

        showNextComment,

        2500

      );

    }


    if(
      commentQueue.length > 0
    ){

      setTimeout(

        showNextComment,

        800

      );

    }

  }
  catch(error){

    console.error(

      'Comments could not be loaded:',

      error

    );

  }

}


loadComments();



/* =====================================================
   POST USER COMMENT
===================================================== */

function postComment(){

  const text =
    commentInput.value.trim();


  if(!text){

    return;

  }


  const displayName =
    name

      ? name.split(' ')[0]

      : 'You';


  addComment(

    displayName,

    text,

    'Attendee'

  );


  commentInput.value = '';


  commentInput.focus();

}



/* =====================================================
   SEND BUTTON
===================================================== */

document
  .getElementById(
    'commentBtn'
  )
  .addEventListener(

    'click',

    postComment

  );



/* =====================================================
   ENTER TO SEND
===================================================== */

commentInput.addEventListener(

  'keydown',

  function(e){

    if(
      e.key === 'Enter'
    ){

      e.preventDefault();

      postComment();

    }

  }

);

</script>
