<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webinar Registration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F1117;
    --panel: #171A24;
    --field: #12141C;
    --line: #2A2E3D;
    --ink: #F2F0EB;
    --muted: #9095AC;
    --gold: #E8A33D;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1, .badge{font-family:'Space Grotesk', sans-serif;}

  .wrap{
    max-width:520px;
    margin:0 auto;
    padding:56px 24px 64px;
  }

  .badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--gold);
    border:1px solid rgba(232,163,61,0.35);
    padding:7px 16px;
    border-radius:100px;
    margin-bottom:24px;
  }
  .badge .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--gold);
  }

  h1{
    font-size:32px;
    font-weight:700;
    line-height:1.18;
    letter-spacing:-0.01em;
  }
  .sub{
    margin-top:14px;
    font-size:15.5px;
    color:var(--muted);
    max-width:48ch;
  }

  .panel{
    margin-top:36px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:28px;
  }

  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--muted);
    margin-bottom:7px;
  }
  .field input{
    width:100%;
    background:var(--field);
    border:1px solid var(--line);
    color:var(--ink);
    padding:14px 16px;
    border-radius:10px;
    font-size:15px;
    font-family:inherit;
  }
  .field input:focus{
    outline:2px solid var(--gold);
    outline-offset:1px;
    border-color:var(--gold);
  }
  .field input::placeholder{color:#5C6079;}

  .submit-btn{
    width:100%;
    margin-top:6px;
    background:var(--gold);
    color:#1A1204;
    border:none;
    padding:16px;
    border-radius:10px;
    font-weight:700;
    font-size:15px;
    font-family:inherit;
    cursor:pointer;
    transition:filter .15s ease, transform .15s ease;
  }
  .submit-btn:hover{filter:brightness(1.08);}
  .submit-btn:active{transform:scale(0.99);}

  .error{
    color:#F0866B;
    font-size:13px;
    margin-top:10px;
    display:none;
  }

  .form-note{
    font-size:12.5px;
    color:var(--muted);
    margin-top:16px;
    text-align:center;
  }

  .meta-row{
    display:flex;
    gap:20px;
    margin-top:26px;
    font-size:13.5px;
    color:var(--muted);
    flex-wrap:wrap;
  }
  .meta-row div{display:flex; align-items:center; gap:7px;}
  .meta-row strong{color:var(--ink); font-weight:600;}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>

<div class="wrap">
  <span class="badge"><span class="dot"></span> Live Webinar</span>
  <h1>Your Webinar Title Goes Here</h1>
  <p class="sub">One or two sentences on what people will learn or get out of attending. Swap this copy for your real topic.</p>

  <div class="meta-row">
    <div>📅 <strong>Date TBD</strong></div>
    <div>⏱ <strong>Duration TBD</strong></div>
    <div>🎤 <strong>Speaker Name</strong></div>
  </div>

  <div class="panel">
    <form id="regForm">
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" placeholder="Jane Doe" required>
      </div>
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="jane@company.com" required>
      </div>
      <div class="field">
        <label for="datetime">Preferred date &amp; time</label>
        <input type="datetime-local" id="datetime">
      </div>
      <button type="submit" class="submit-btn">Join Live Webinar Now →</button>
      <div class="error" id="formError">Please enter your name and a valid email.</div>
    </form>
    <p class="form-note">No spam — just your webinar access link.</p>
  </div>
</div>

<script>
  const regForm = document.getElementById('regForm');
  const formError = document.getElementById('formError');

  regForm.addEventListener('submit', function(e){
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

    if(!name || !emailValid){
      formError.style.display = 'block';
      return;
    }
    formError.style.display = 'none';

    // Pass name/email to the video page via URL params (no fake data stored, no scam mechanics)
    const params = new URLSearchParams({ name, email });
    window.location.href = 'video.html?' + params.toString();
  });
</script>

</body>
</html>
