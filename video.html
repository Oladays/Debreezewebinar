<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Watch the Webinar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
  rel="stylesheet"
>

<style>

/* =====================================================
   VARIABLES
===================================================== */

:root{

  --bg:#0F1117;

  --panel:#171A24;

  --field:#12141C;

  --line:#2A2E3D;

  --ink:#F2F0EB;

  --muted:#9095AC;

  --gold:#E8A33D;

  --teal:#3FBFAE;

  --red:#FF6B5E;

}


/* =====================================================
   RESET
===================================================== */

*{

  box-sizing:border-box;

  margin:0;

  padding:0;

}


html,
body{

  height:100%;

}


body{

  background:var(--bg);

  color:var(--ink);

  font-family:'Inter',sans-serif;

  line-height:1.5;

  -webkit-font-smoothing:antialiased;

  display:flex;

  flex-direction:column;

  overflow:hidden;

}


h1,
.badge{

  font-family:'Space Grotesk',sans-serif;

}



/* =====================================================
   TOP BAR
===================================================== */

.topbar{

  border-bottom:1px solid var(--line);

  padding:16px 20px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  flex-shrink:0;

}


.brand{

  font-family:'Space Grotesk',sans-serif;

  font-weight:700;

  font-size:14.5px;

}


.brand span{

  color:var(--gold);

}



/* =====================================================
   LIVE BADGE
===================================================== */

.badge{

  display:inline-flex;

  align-items:center;

  gap:7px;

  font-size:11.5px;

  font-weight:700;

  letter-spacing:.06em;

  text-transform:uppercase;

  color:var(--red);

}


.badge .dot{

  width:8px;

  height:8px;

  border-radius:50%;

  background:var(--red);

  box-shadow:

    0 0 0 3px rgba(255,107,94,.18);

  animation:pulse 1.2s infinite;

}


@keyframes pulse{

  0%,
  100%{

    opacity:1;

    transform:scale(1);

  }

  50%{

    opacity:.4;

    transform:scale(.85);

  }

}



/* =====================================================
   VIDEO
===================================================== */

.video-frame{

  position:relative;

  width:100%;

  padding-top:42%;

  background:#000;

  flex-shrink:0;

  overflow:hidden;

}


.video-frame iframe{

  position:absolute;

  top:0;

  left:0;

  width:100%;

  height:100%;

  border:0;

}


/*
   Transparent shield.

   This prevents visitors from touching
   the YouTube player and opening controls.
*/

.video-touch-shield{

  position:absolute;

  inset:0;

  z-index:20;

  background:transparent;

  pointer-events:auto;

  touch-action:none;

  user-select:none;

}



/* =====================================================
   GET STARTED CTA
===================================================== */

.cta-area{

  display:none;

  padding:14px 20px;

  border-bottom:1px solid var(--line);

  background:var(--bg);

}


.cta-area.show{

  display:block;

}


.support-link{

  display:block;

  width:100%;

  text-align:center;

  color:var(--gold);

  text-decoration:none;

  font-weight:800;

  font-size:15px;

  letter-spacing:.01em;

}


/*
   When video ends:

   Bold
   Bright
   Pulsing
   Blinking
*/

.cta-area.show .support-link{

  animation:

    ctaPulse 1s infinite,

    ctaBlink 1.4s infinite;

}


@keyframes ctaPulse{

  0%,
  100%{

    transform:scale(1);

  }

  50%{

    transform:scale(1.04);

  }

}


@keyframes ctaBlink{

  0%,
  45%{

    opacity:1;

  }

  50%,
  70%{

    opacity:.45;

  }

  75%,
  100%{

    opacity:1;

  }

}



/* =====================================================
   META STRIP
===================================================== */

.meta-strip{

  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:12px 20px;

  border-bottom:1px solid var(--line);

  font-size:13px;

  color:var(--muted);

  flex-shrink:0;

}


.meta-strip .viewers{

  display:flex;

  align-items:center;

  gap:6px;

}


.meta-strip strong{

  color:var(--ink);

}



/* =====================================================
   COMMENTS
===================================================== */

.comments-feed{

  flex:1;

  overflow-y:auto;

  padding:16px 20px;

  -webkit-overflow-scrolling:touch;

  scroll-behavior:smooth;

}


.comment{

  display:flex;

  gap:12px;

  padding:12px 14px;

  background:var(--panel);

  border-radius:12px;

  margin-bottom:10px;

  max-width:92%;

  opacity:0;

  transform:translateY(10px);

  animation:commentAppear .45s ease forwards;

}


@keyframes commentAppear{

  from{

    opacity:0;

    transform:translateY(10px);

  }

  to{

    opacity:1;

    transform:translateY(0);

  }

}


.avatar{

  width:32px;

  height:32px;

  border-radius:50%;

  background:

    linear-gradient(

      135deg,

      var(--teal),

      var(--gold)

    );

  flex-shrink:0;

}


.comment-body{

  flex:1;

  min-width:0;

}


.comment-name{

  font-weight:600;

  font-size:13.5px;

}


.comment-role{

  font-size:11.5px;

  color:var(--muted);

  margin-left:6px;

  font-weight:400;

}


.comment-text{

  font-size:14px;

  color:#C9CCDA;

  margin-top:3px;

  word-wrap:break-word;

}


/*
   NO timestamp.
   NO date.
   NO "ago".
   NO clock.
*/


.empty-note{

  font-size:13.5px;

  color:var(--muted);

  text-align:center;

  padding:32px 0;

}



/* =====================================================
   COMMENT FORM
===================================================== */

.comment-form{

  display:flex;

  gap:10px;

  padding:

    14px

    20px

    calc(14px + env(safe-area-inset-bottom));

  border-top:1px solid var(--line);

  background:var(--bg);

  flex-shrink:0;

}


.comment-form input{

  flex:1;

  background:var(--field);

  border:1px solid var(--line);

  color:var(--ink);

  padding:14px 16px;

  border-radius:24px;

  font-size:14.5px;

  font-family:inherit;

}


.comment-form input::placeholder{

  color:#5C6079;

}


.comment-form input:focus{

  outline:2px solid var(--teal);

  outline-offset:1px;

  border-color:var(--teal);

}


.comment-form button{

  background:var(--gold);

  color:#1A1204;

  border:none;

  padding:0 22px;

  border-radius:24px;

  font-weight:700;

  font-size:14px;

  font-family:inherit;

  cursor:pointer;

  flex-shrink:0;

}


.comment-form button:active{

  transform:scale(.97);

}



/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  .topbar{

    padding:14px 16px;

  }


  .video-frame{

    padding-top:56.25%;

  }


  .meta-strip{

    padding:11px 16px;

  }


  .comments-feed{

    padding:14px 16px;

  }


  .comment-form{

    padding-left:16px;

    padding-right:16px;

  }


  .comment-form button{

    padding:0 18px;

  }


  .support-link{

    font-size:15px;

  }

}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media(prefers-reduced-motion:reduce){

  *{

    animation:none !important;

    transition:none !important;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     TOP BAR
===================================================== -->

<div class="topbar">

  <div class="brand">

    WEBINAR<span>.</span>

  </div>


  <span class="badge">

    <span class="dot"></span>

    LIVE

  </span>

</div>



<!-- =====================================================
     VIDEO
===================================================== -->

<div class="video-frame">

  <div id="youtubePlayer"></div>


  <div
    class="video-touch-shield"
    aria-hidden="true"
  ></div>

</div>



<!-- =====================================================
     GET STARTED
     
     Hidden until video ends.
===================================================== -->

<div
  class="cta-area"
  id="ctaArea"
>

  <a
    class="support-link"
    id="supportLink"
    href="https://t.me/debreeze_support"
    target="_blank"
    rel="noopener noreferrer"
  >

    CLICK HERE TO GET STARTED

  </a>

</div>



<!-- =====================================================
     META
===================================================== -->

<div class="meta-strip">

  <span id="welcomeNote">

    Welcome — enjoy the session.

  </span>


  <span class="viewers">

    💬

    <strong id="commentCount">
      0
    </strong>

    comments

  </span>

</div>



<!-- =====================================================
     COMMENTS
===================================================== -->

<div
  class="comments-feed"
  id="commentsFeed"
>

  <p
    class="empty-note"
    id="emptyNote"
  >

    No comments yet — be the first to share your thoughts.

  </p>

</div>



<!-- =====================================================
     COMMENT INPUT
===================================================== -->

<div class="comment-form">

  <input
    type="text"
    id="commentInput"
    placeholder="Drop your comment..."
    autocomplete="off"
  >


  <button
    id="commentBtn"
  >

    Send

  </button>

</div>



<script>


/* =====================================================
   NAME FROM REGISTRATION URL
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const name =
  params.get('name');


if(name){

  const safeName =
    name

      .replace(/</g,'&lt;')

      .replace(/>/g,'&gt;');


  document.getElementById(
    'welcomeNote'
  ).innerHTML =

    `Welcome, <strong>${safeName}</strong>`;

}



/* =====================================================
   YOUTUBE
===================================================== */

let player;

let lastAllowedTime = 0;

let videoStarted = false;

let videoFinished = false;

let soundAttempted = false;


const YOUTUBE_VIDEO_ID =
  'AW4IqId5kdM';



/* =====================================================
   YOUTUBE API READY
===================================================== */

function onYouTubeIframeAPIReady(){

  player =
    new YT.Player(

      'youtubePlayer',

      {

        videoId:
          YOUTUBE_VIDEO_ID,


        playerVars:{

          /*
             AUTOPLAY ON
          */

          autoplay:1,


          /*
             IMPORTANT:

             We are NOT setting mute:1.

             The video is requested with sound.
          */

          controls:0,

          disablekb:1,

          fs:0,

          rel:0,

          playsinline:1,

          modestbranding:1,

          iv_load_policy:3

        },


        events:{

          onReady:
            onPlayerReady,

          onStateChange:
            onPlayerStateChange

        }

      }

    );

}



/* =====================================================
   PLAYER READY
===================================================== */

function onPlayerReady(event){

  player = event.target;


  /*
     Try to play WITH SOUND.

     Some mobile browsers may block this.
  */

  try{

    player.unMute();

    player.setVolume(100);

    player.playVideo();

    soundAttempted = true;

  }

  catch(error){

    console.log(
      'Autoplay with sound was blocked:',
      error
    );

  }


  lastAllowedTime = 0;



  /*
     Monitor video position.

     Prevent large seeking jumps.
  */

  setInterval(

    function(){

      if(
        !player ||
        videoFinished
      ){

        return;

      }


      const state =
        player.getPlayerState();


      if(

        state ===
        YT.PlayerState.PLAYING

        ||

        state ===
        YT.PlayerState.PAUSED

      ){

        const currentTime =
          player.getCurrentTime();


        if(!videoStarted){

          lastAllowedTime =
            currentTime;

          return;

        }


        const difference =
          currentTime -
          lastAllowedTime;


        /*
           Prevent forward/backward seeking.
        */

        if(

          difference > 2.5

          ||

          difference < -1.5

        ){

          player.seekTo(

            lastAllowedTime,

            true

          );

        }

        else if(

          state ===
          YT.PlayerState.PLAYING

        ){

          lastAllowedTime =
            currentTime;

        }

      }

    },

    500

  );

}



/* =====================================================
   VIDEO STATE
===================================================== */

function onPlayerStateChange(event){

  /*
     PLAYING
  */

  if(

    event.data ===
    YT.PlayerState.PLAYING

  ){

    videoStarted = true;


    /*
       Keep sound enabled.
    */

    try{

      player.unMute();

      player.setVolume(100);

    }

    catch(error){}

  }



  /*
     VIDEO ENDED
  */

  if(

    event.data ===
    YT.PlayerState.ENDED

  ){

    videoFinished = true;


    lastAllowedTime =
      player.getDuration();


    /*
       Show CTA.
    */

    showCTA();


    /*
       Try notification beep.
    */

    playBeep();

  }

}



/* =====================================================
   SHOW CTA AFTER VIDEO ENDS
===================================================== */

function showCTA(){

  const cta =
    document.getElementById(
      'ctaArea'
    );


  if(!cta){

    return;

  }


  cta.classList.add(
    'show'
  );

}



/* =====================================================
   BEEP
===================================================== */

function playBeep(){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if(!AudioContext){

      return;

    }


    const audio =
      new AudioContext();


    const oscillator =
      audio.createOscillator();


    const gain =
      audio.createGain();


    oscillator.type =
      'sine';


    oscillator.frequency.value =
      880;


    gain.gain.setValueAtTime(

      0.001,

      audio.currentTime

    );


    gain.gain.exponentialRampToValueAtTime(

      0.15,

      audio.currentTime + 0.02

    );


    gain.gain.exponentialRampToValueAtTime(

      0.001,

      audio.currentTime + 0.35

    );


    oscillator.connect(gain);

    gain.connect(audio.destination);


    oscillator.start();


    oscillator.stop(

      audio.currentTime + 0.35

    );

  }

  catch(error){

    console.log(
      'Beep blocked by browser:',
      error
    );

  }

}



/* =====================================================
   LOAD YOUTUBE API
===================================================== */

const youtubeScript =
  document.createElement(
    'script'
  );


youtubeScript.src =
  'https://www.youtube.com/iframe_api';


document.head.appendChild(
  youtubeScript
);



/* =====================================================
   COMMENTS
===================================================== */

const commentsFeed =
  document.getElementById(
    'commentsFeed'
  );


const commentInput =
  document.getElementById(
    'commentInput'
  );


const commentCount =
  document.getElementById(
    'commentCount'
  );


let count = 0;



/* =====================================================
   GOOGLE SHEET
===================================================== */

const GOOGLE_SHEET_ID =
  '1TWYiRuuZiLuuxlTwGkxgZvW97Yyxn1nV';



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(value || '')

    .replace(/&/g,'&amp;')

    .replace(/</g,'&lt;')

    .replace(/>/g,'&gt;')

    .replace(/"/g,'&quot;')

    .replace(/'/g,'&#039;');

}



/* =====================================================
   ADD COMMENT
===================================================== */

function addComment(

  displayName,

  text,

  role='Attendee'

){

  if(
    !text ||
    !text.trim()
  ){

    return;

  }


  /*
     Remove empty message.
  */

  const emptyNote =
    document.getElementById(
      'emptyNote'
    );


  if(emptyNote){

    emptyNote.remove();

  }


  /*
     Create comment.

     IMPORTANT:

     There is NO timestamp here.
  */

  const el =
    document.createElement(
      'div'
    );


  el.className =
    'comment';


  el.innerHTML = `

    <div class="avatar"></div>

    <div class="comment-body">

      <div class="comment-name">

        ${escapeHTML(displayName)}

        <span class="comment-role">

          ${escapeHTML(role)}

        </span>

      </div>

      <p class="comment-text"></p>

    </div>

  `;


  /*
     Put the actual comment text
     into the paragraph.
  */

  el.querySelector(
    '.comment-text'
  ).textContent =
    text;


  commentsFeed.appendChild(
    el
  );


  count++;

  commentCount.textContent =
    count;


  /*
     Scroll to newest comment.
  */

  requestAnimationFrame(

    function(){

      commentsFeed.scrollTo({

        top:
          commentsFeed.scrollHeight,

        behavior:
          'smooth'

      });

    }

  );

}



/* =====================================================
   LOAD GOOGLE SHEET COMMENTS
===================================================== */

async function loadComments(){

  try{

    const url =
      `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:json`;


    const response =
      await fetch(url);


    if(!response.ok){

      throw new Error(
        'Unable to load comments'
      );

    }


    const raw =
      await response.text();


    const jsonText =
      raw.substring(

        raw.indexOf('{'),

        raw.lastIndexOf('}') + 1

      );


    const data =
      JSON.parse(
        jsonText
      );


    const rows =
      data.table.rows || [];


    const columns =
      data.table.cols || [];


    /*
       Get column names.
    */

    const headers =
      columns.map(

        function(col){

          return String(
            col.label || ''
          )
          .trim()
          .toLowerCase();

        }

      );



    /* =================================================
       FIND NAME COLUMN
    ================================================= */

    let nameIndex =
      headers.findIndex(

        function(header){

          return(

            header === 'name'

            ||

            header === 'username'

            ||

            header === 'user'

            ||

            header === 'full name'

            ||

            header === 'fullname'

          );

        }

      );



    /* =================================================
       FIND COMMENT COLUMN
    ================================================= */

    let commentIndex =
      headers.findIndex(

        function(header){

          return(

            header === 'comment'

            ||

            header === 'comments'

            ||

            header === 'message'

            ||

            header === 'text'

            ||

            header === 'comment text'

          );

        }

      );



    /* =================================================
       SMART FALLBACK
       
       Your sheet appears to be:

       Column A = Timestamp
       Column B = Name
       Column C = Comment

       So if headers aren't detected,
       DO NOT use Column A as the name.
    ================================================= */

    if(
      nameIndex === -1 &&
      commentIndex === -1
    ){

      if(
        columns.length >= 3
      ){

        /*
           Skip timestamp.
        */

        nameIndex = 1;

        commentIndex = 2;

      }

      else{

        /*
           If only two columns exist,
           assume Name + Comment.
        */

        nameIndex = 0;

        commentIndex = 1;

      }

    }


    /*
       If only name was found,
       find a reasonable comment column.
    */

    if(
      nameIndex === -1
    ){

      nameIndex = 1;

    }


    if(
      commentIndex === -1
    ){

      /*
         If timestamp + name + comment
         exists, use third column.
      */

      if(
        columns.length >= 3
      ){

        commentIndex = 2;

      }

      else{

        commentIndex = 1;

      }

    }



    /* =================================================
       BUILD COMMENT QUEUE
    ================================================= */

    const commentQueue = [];


    rows.forEach(

      function(row){

        const cells =
          row.c || [];


        /*
           NAME

           Timestamp is NEVER used.
        */

        let displayName = 'Attendee';


        if(
          cells[nameIndex] &&
          cells[nameIndex].v !== undefined &&
          cells[nameIndex].v !== null
        ){

          displayName =
            String(
              cells[nameIndex].v
            ).trim();

        }


        /*
           COMMENT

           This is the actual
           comment/message column.
        */

        let commentText = '';


        if(
          cells[commentIndex] &&
          cells[commentIndex].v !== undefined &&
          cells[commentIndex].v !== null
        ){

          commentText =
            String(
              cells[commentIndex].v
            ).trim();

        }


        /*
           Ignore rows without comments.
        */

        if(
          commentText
        ){

          commentQueue.push({

            name:
              displayName || 'Attendee',

            text:
              commentText

          });

        }

      }

    );



    /* =================================================
       SHOW COMMENTS ONE BY ONE
    ================================================= */

    let index = 0;


    function showNextComment(){

      if(
        index >=
        commentQueue.length
      ){

        return;

      }


      const comment =
        commentQueue[index];


      addComment(

        comment.name,

        comment.text,

        'Attendee'

      );


      index++;


      /*
         Next comment after 2.5 seconds.
      */

      setTimeout(

        showNextComment,

        2500

      );

    }


    /*
       Start comments.
    */

    if(
      commentQueue.length
    ){

      setTimeout(

        showNextComment,

        800

      );

    }

  }

  catch(error){

    console.error(

      'Comments could not be loaded:',

      error

    );

  }

}



/* =====================================================
   START COMMENT LOADING
===================================================== */

loadComments();



/* =====================================================
   USER COMMENT
===================================================== */

function postComment(){

  const text =
    commentInput.value.trim();


  if(!text){

    return;

  }


  const displayName =
    name

      ? name.split(' ')[0]

      : 'You';


  /*
     Add immediately.

     No timestamp.
  */

  addComment(

    displayName,

    text,

    'Attendee'

  );


  commentInput.value = '';


  commentInput.focus();

}



/* =====================================================
   SEND BUTTON
===================================================== */

document
  .getElementById(
    'commentBtn'
  )
  .addEventListener(

    'click',

    postComment

  );



/* =====================================================
   ENTER KEY
===================================================== */

commentInput.addEventListener(

  'keydown',

  function(e){

    if(
      e.key === 'Enter'
    ){

      e.preventDefault();

      postComment();

    }

  }

);

</script>

</body>
</html>
