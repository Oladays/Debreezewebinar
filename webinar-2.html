<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Watch the Webinar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
  rel="stylesheet"
>

<style>

:root{
  --bg:#0F1117;
  --panel:#171A24;
  --field:#12141C;
  --line:#2A2E3D;
  --ink:#F2F0EB;
  --muted:#9095AC;
  --gold:#E8A33D;
  --teal:#3FBFAE;
  --red:#FF6B5E;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
}

body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;

  display:flex;
  flex-direction:column;

  overflow:hidden;
}


/* =========================
   TOP BAR
========================= */

.topbar{
  border-bottom:1px solid var(--line);

  padding:16px 20px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  flex-shrink:0;
}

.brand{
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:14.5px;
}

.brand span{
  color:var(--gold);
}


/* =========================
   LIVE
========================= */

.badge{
  display:inline-flex;
  align-items:center;
  gap:7px;

  font-family:'Space Grotesk',sans-serif;
  font-size:11.5px;
  font-weight:700;

  letter-spacing:.06em;
  text-transform:uppercase;

  color:var(--red);
}

.badge .dot{
  width:8px;
  height:8px;

  border-radius:50%;

  background:var(--red);

  box-shadow:
    0 0 0 3px rgba(255,107,94,.18);

  animation:livePulse 1.2s infinite;
}

@keyframes livePulse{

  0%,100%{
    opacity:1;
    transform:scale(1);
  }

  50%{
    opacity:.4;
    transform:scale(.85);
  }

}


/* =========================
   VIDEO
========================= */

.video-frame{
  position:relative;

  width:100%;

  padding-top:56.25%;

  background:#000;

  flex-shrink:0;

  overflow:hidden;
}

.video-frame iframe{
  position:absolute;

  top:0;
  left:0;

  width:100%;
  height:100%;

  border:0;
}


/* =========================
   SMALL DEBREEZE COVER
========================= */

.video-brand-overlay{

  position:absolute;

  top:6px;
  left:8px;

  z-index:30;

  width:auto;
  height:auto;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:6px 12px;

  background:#000;

  color:#F2F0EB;

  font-family:'Space Grotesk',sans-serif;

  font-size:13px;

  font-weight:700;

  letter-spacing:.06em;

  text-transform:uppercase;

  border-radius:4px;

  pointer-events:none;

  user-select:none;

}


/* =========================
   SOUND OVERLAY
========================= */

.sound-overlay{

  position:absolute;

  bottom:14px;

  right:14px;

  z-index:60;

  display:flex;

  align-items:center;

  gap:8px;

  padding:10px 16px;

  border-radius:24px;

  background:rgba(0,0,0,.72);

  color:#F2F0EB;

  font-family:'Space Grotesk',sans-serif;

  font-size:13px;

  font-weight:700;

  letter-spacing:.02em;

  border:1px solid rgba(255,255,255,.25);

  cursor:pointer;

  animation:soundPulse 1.4s infinite;

}

.sound-overlay.hide{

  display:none;

}

@keyframes soundPulse{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.04);
  }

}


/* =========================
   VIDEO TOUCH SHIELD
========================= */

.video-touch-shield{

  position:absolute;

  inset:0;

  z-index:50;

  background:transparent;

  pointer-events:auto;

  touch-action:none;

  user-select:none;

  -webkit-user-select:none;

}


/* =========================
   WELCOME
========================= */

.meta-strip{

  display:flex;

  align-items:center;

  justify-content:flex-start;

  padding:12px 20px;

  border-bottom:1px solid var(--line);

  font-size:13px;

  color:var(--muted);

  flex-shrink:0;
}

.meta-strip strong{
  color:var(--ink);
}


/* =========================
   COMMENTS
========================= */

.comments-feed{

  flex:1;

  overflow-y:auto;

  overflow-x:hidden;

  padding:16px 20px;

  -webkit-overflow-scrolling:touch;
}


/* =========================
   COMMENT
========================= */

.comment{

  display:flex;

  gap:12px;

  padding:12px 14px;

  background:var(--panel);

  border-radius:12px;

  margin-bottom:10px;

  max-width:92%;

  opacity:0;

  transform:translateY(10px);

  animation:commentIn .45s ease forwards;
}

@keyframes commentIn{

  from{
    opacity:0;
    transform:translateY(10px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}


/* =========================
   AVATAR
========================= */

.avatar{

  width:32px;
  height:32px;

  min-width:32px;

  border-radius:50%;

  background:
    linear-gradient(
      135deg,
      var(--teal),
      var(--gold)
    );
}


/* =========================
   COMMENT BODY
========================= */

.comment-body{

  flex:1;

  min-width:0;
}

.comment-name{

  font-weight:600;

  font-size:13.5px;
}

.comment-role{

  font-size:11.5px;

  color:var(--muted);

  margin-left:6px;

  font-weight:400;
}

.comment-text{

  font-size:14px;

  color:#C9CCDA;

  margin-top:3px;

  word-break:break-word;
}

.empty-note{

  font-size:13.5px;

  color:var(--muted);

  text-align:center;

  padding:32px 0;
}


/* =========================
   BOTTOM
========================= */

.bottom-area{

  display:flex;

  gap:10px;

  padding:
    14px
    20px
    calc(14px + env(safe-area-inset-bottom));

  border-top:1px solid var(--line);

  background:var(--bg);

  flex-shrink:0;
}


/* =========================
   INPUT
========================= */

.comment-input-wrap{

  flex:1;

  min-width:0;
}

.comment-form-input{

  width:100%;

  background:var(--field);

  border:1px solid var(--line);

  color:var(--ink);

  padding:14px 16px;

  border-radius:24px;

  font-size:14.5px;

  font-family:inherit;
}

.comment-form-input::placeholder{
  color:#5C6079;
}

.comment-form-input:focus{

  outline:2px solid var(--teal);

  outline-offset:1px;

  border-color:var(--teal);
}


/* =========================
   SEND
========================= */

.send-button{

  background:var(--gold);

  color:#1A1204;

  border:none;

  padding:0 22px;

  border-radius:24px;

  font-weight:700;

  font-size:14px;

  font-family:inherit;

  cursor:pointer;

  flex-shrink:0;
}

.send-button:active{
  transform:scale(.97);
}


/* =========================
   FINAL CTA
========================= */

.final-cta{

  display:none;

  width:100%;

  min-height:52px;

  align-items:center;

  justify-content:center;

  text-align:center;

  padding:13px 20px;

  border-radius:28px;

  background:var(--gold);

  color:#1A1204;

  text-decoration:none;

  font-family:'Space Grotesk',sans-serif;

  font-size:15px;

  font-weight:800;

  letter-spacing:.02em;

  animation:
    ctaPulse 1s infinite,
    ctaGlow 1.2s infinite;
}

.final-cta.show{
  display:flex;
}

@keyframes ctaPulse{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.035);
  }

}

@keyframes ctaGlow{

  0%,100%{
    box-shadow:0 0 0 rgba(232,163,61,0);
  }

  50%{
    box-shadow:0 0 22px rgba(232,163,61,.55);
  }

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .topbar{
    padding:14px 16px;
  }

  .video-frame{
    padding-top:56.25%;
  }

  .video-brand-overlay{

    padding:5px 10px;

    font-size:12px;

  }

  .meta-strip{
    padding:11px 16px;
  }

  .comments-feed{
    padding:14px 16px;
  }

  .bottom-area{

    padding-left:16px;

    padding-right:16px;

  }

  .send-button{
    padding:0 18px;
  }

}


@media(prefers-reduced-motion:reduce){

  *{
    animation:none !important;
    transition:none !important;
  }

}

</style>

</head>

<script>

/* =====================================================
   NAME
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const name =
  params.get('name');

if(name){

  const safeName =
    name
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;');

  document.getElementById(
    'welcomeNote'
  ).innerHTML =
    `Welcome, <strong>${safeName}</strong>`;

}


/* =====================================================
   VIDEO
===================================================== */

const YOUTUBE_VIDEO_ID =
  'AW4IqId5kdM';


/*
   VIDEO POSITION

   Never delete this value.

   It survives refresh.
*/

const VIDEO_PROGRESS_KEY =
  'debreeze_webinar_AW4IqId5kdM_position';


/*
   COMMENT POSITION

   This is separate from the video.

   It means the comments DON'T restart
   from comment #1 after minimizing or refresh.
*/

const COMMENT_PROGRESS_KEY =
  'debreeze_webinar_AW4IqId5kdM_comment_index';


let player = null;

let playerReady = false;

let videoStarted = false;

let videoFinished = false;

let lastAllowedTime = 0;

let soundUnlocked = false;


/* =====================================================
   VIDEO POSITION
===================================================== */

function getSavedVideoPosition(){

  try{

    const saved =
      localStorage.getItem(
        VIDEO_PROGRESS_KEY
      );

    if(
      saved === null ||
      saved === ''
    ){

      return 0;

    }

    const position =
      parseFloat(saved);

    if(
      Number.isFinite(position) &&
      position >= 0
    ){

      return position;

    }

  }
  catch(error){

    console.log(
      'Could not read video position',
      error
    );

  }

  return 0;

}


function saveVideoPosition(){

  if(
    !player ||
    !playerReady
  ){

    return;

  }

  try{

    const currentTime =
      player.getCurrentTime();

    if(
      Number.isFinite(currentTime) &&
      currentTime >= 0
    ){

      localStorage.setItem(
        VIDEO_PROGRESS_KEY,
        String(currentTime)
      );

      lastAllowedTime =
        currentTime;

    }

  }
  catch(error){

    console.log(
      'Could not save video position',
      error
    );

  }

}


/* =====================================================
   YOUTUBE API
===================================================== */

function onYouTubeIframeAPIReady(){

  player =
    new YT.Player(

      'youtubePlayer',

      {

        videoId:
          YOUTUBE_VIDEO_ID,

        playerVars:{

          autoplay:1,

          mute:1,

          controls:0,

          disablekb:1,

          fs:0,

          rel:0,

          playsinline:1,

          modestbranding:1,

          iv_load_policy:3,

          host:
            'https://www.youtube-nocookie.com'

        },

        events:{

          onReady:
            onPlayerReady,

          onStateChange:
            onPlayerStateChange

        }

      }

    );

}


/* =====================================================
   PLAYER READY
===================================================== */

function onPlayerReady(event){

  player =
    event.target;

  playerReady =
    true;


  const savedPosition =
    getSavedVideoPosition();


  /*
     Start playback FIRST.

     Player is muted via playerVars so
     this is never blocked by the browser.
  */

  try{

    player.playVideo();

  }
  catch(error){

    console.log(
      'Playback start error:',
      error
    );

  }


  /*
     Give YouTube time to initialise,
     then restore exact position.
  */

  setTimeout(function(){

    if(!player){
      return;
    }

    try{

      const duration =
        player.getDuration();


      /*
         Viewer already finished the
         video on a previous visit —
         land on the ended state instead
         of replaying from the saved spot.
      */

      if(
        Number.isFinite(duration) &&
        duration > 0 &&
        savedPosition >=
          duration - 1
      ){

        videoFinished = true;

        lastAllowedTime = duration;

        player.pauseVideo();

        showFinalCTA();

        stopComments();

        return;

      }


      if(savedPosition > 2){

        player.seekTo(
          savedPosition,
          true
        );

        lastAllowedTime =
          savedPosition;

      }

      player.playVideo();

    }
    catch(error){

      console.log(
        'Resume error:',
        error
      );

    }

  },1200);


  /*
     Save video position continuously.
  */

  setInterval(function(){

    if(
      !player ||
      !playerReady ||
      videoFinished
    ){

      return;

    }

    const state =
      player.getPlayerState();


    if(
      state === YT.PlayerState.PLAYING ||
      state === YT.PlayerState.PAUSED
    ){

      const currentTime =
        player.getCurrentTime();


      /*
         Prevent large seeking.
      */

      if(videoStarted){

        const difference =
          currentTime -
          lastAllowedTime;


        if(
          difference > 2.5 ||
          difference < -1.5
        ){

          player.seekTo(
            lastAllowedTime,
            true
          );

        }
        else{

          lastAllowedTime =
            currentTime;

        }

      }
      else{

        lastAllowedTime =
          currentTime;

      }


      /*
         Save exact position.
      */

      try{

        localStorage.setItem(
          VIDEO_PROGRESS_KEY,
          String(currentTime)
        );

      }
      catch(error){}

    }

  },500);

}


/* =====================================================
   SOUND UNLOCK

   Muted autoplay is always allowed by
   browsers. Real sound requires an
   actual tap, so we ask for one here
   instead of forcing unMute() blindly.
===================================================== */

function unlockSound(){

  if(
    soundUnlocked ||
    !player
  ){

    return;

  }

  try{

    player.unMute();

    player.setVolume(100);

    soundUnlocked = true;


    const overlay =
      document.getElementById(
        'soundOverlay'
      );

    if(overlay){

      overlay.classList.add(
        'hide'
      );

    }

  }
  catch(error){

    console.log(
      'Unmute error:',
      error
    );

  }

}


document
  .getElementById(
    'soundOverlay'
  )
  .addEventListener(

    'click',

    unlockSound

  );


document
  .querySelector(
    '.video-touch-shield'
  )
  .addEventListener(

    'click',

    unlockSound

  );


/* =====================================================
   PLAYER STATE
===================================================== */

function onPlayerStateChange(event){

  if(
    event.data ===
    YT.PlayerState.PLAYING
  ){

    videoStarted =
      true;

  }


  if(
    event.data ===
    YT.PlayerState.PAUSED
  ){

    saveVideoPosition();

  }


  if(
    event.data ===
    YT.PlayerState.ENDED
  ){

    videoFinished =
      true;


    const duration =
      player.getDuration();


    lastAllowedTime =
      duration;


    try{

      localStorage.setItem(
        VIDEO_PROGRESS_KEY,
        String(duration)
      );

    }
    catch(error){}


    showFinalCTA();

    playBeep();


    /*
       Video has ended, so the "live"
       webinar is over — stop the
       comment feed too.
    */

    stopComments();

  }

}


/* =====================================================
   SAVE WHEN MINIMISED
===================================================== */

document.addEventListener(

  'visibilitychange',

  function(){

    if(
      document.visibilityState ===
      'hidden'
    ){

      /*
         Save video.
      */

      saveVideoPosition();


      /*
         Save comment position.
      */

      saveCommentProgress();

    }

  }

);


/* =====================================================
   SAVE WHEN PAGE LEAVES
===================================================== */

window.addEventListener(

  'pagehide',

  function(){

    saveVideoPosition();

    saveCommentProgress();

  }

);

window.addEventListener(

  'beforeunload',

  function(){

    saveVideoPosition();

    saveCommentProgress();

  }

);


/* =====================================================
   FINAL CTA
===================================================== */

function showFinalCTA(){

  const inputWrap =
    document.getElementById(
      'commentInputWrap'
    );

  const sendButton =
    document.getElementById(
      'commentBtn'
    );

  const finalCTA =
    document.getElementById(
      'finalCTA'
    );


  if(inputWrap){

    inputWrap.style.display =
      'none';

  }


  if(sendButton){

    sendButton.style.display =
      'none';

  }


  if(finalCTA){

    finalCTA.classList.add(
      'show'
    );

  }

}


/* =====================================================
   BEEP
===================================================== */

function playBeep(){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if(!AudioContext){
      return;
    }


    const audio =
      new AudioContext();


    const oscillator =
      audio.createOscillator();


    const gain =
      audio.createGain();


    oscillator.type =
      'sine';


    oscillator.frequency.value =
      880;


    gain.gain.setValueAtTime(
      0.001,
      audio.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.15,
      audio.currentTime + 0.02
    );


    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audio.currentTime + 0.35
    );


    oscillator.connect(gain);

    gain.connect(audio.destination);


    oscillator.start();

    oscillator.stop(
      audio.currentTime + 0.35
    );

  }
  catch(error){

    console.log(
      'Beep blocked:',
      error
    );

  }

}


/* =====================================================
   YOUTUBE SCRIPT
===================================================== */

const youtubeScript =
  document.createElement('script');

youtubeScript.src =
  'https://www.youtube.com/iframe_api';

document.head.appendChild(
  youtubeScript
);


/* =====================================================
   COMMENTS
===================================================== */

const commentsFeed =
  document.getElementById(
    'commentsFeed'
  );

const commentInput =
  document.getElementById(
    'commentInput'
  );


/*
   NEW GOOGLE SHEET
*/

const GOOGLE_SHEET_ID =
  '17x9WaxFXhbhgCG4v_mJZJVheGa0F0515';


/* =====================================================
   COMMENT POSITION
===================================================== */

let comments = [];

let currentCommentIndex = 0;

let commentTimer = null;

let commentsStopped = false;


/*
   Read saved comment position.
*/

function getSavedCommentProgress(){

  try{

    const saved =
      localStorage.getItem(
        COMMENT_PROGRESS_KEY
      );


    if(
      saved === null ||
      saved === ''
    ){

      return 0;

    }


    const index =
      parseInt(
        saved,
        10
      );


    if(
      Number.isInteger(index) &&
      index >= 0
    ){

      return index;

    }

  }
  catch(error){

    console.log(
      'Could not read comment position',
      error
    );

  }


  return 0;

}


/*
   Save current comment position.
*/

function saveCommentProgress(){

  try{

    localStorage.setItem(

      COMMENT_PROGRESS_KEY,

      String(currentCommentIndex)

    );

  }
  catch(error){

    console.log(
      'Could not save comment position',
      error
    );

  }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(value || '')

    .replace(/&/g,'&amp;')

    .replace(/</g,'&lt;')

    .replace(/>/g,'&gt;')

    .replace(/"/g,'&quot;')

    .replace(/'/g,'&#039;');

}


/* =====================================================
   ADD COMMENT
===================================================== */

function addComment(

  displayName,

  text,

  role='Attendee'

){

  if(
    !text ||
    !String(text).trim()
  ){

    return;

  }


  const emptyNote =
    document.getElementById(
      'emptyNote'
    );


  if(emptyNote){

    emptyNote.remove();

  }


  const element =
    document.createElement(
      'div'
    );


  element.className =
    'comment';


  element.innerHTML = `

    <div class="avatar"></div>

    <div class="comment-body">

      <div class="comment-name">

        ${escapeHTML(displayName)}

        <span class="comment-role">

          ${escapeHTML(role)}

        </span>

      </div>

      <p class="comment-text"></p>

    </div>

  `;


  /*
     IMPORTANT:

     Only the name and actual comment
     are displayed.

     Timestamp is NEVER displayed.
  */

  element.querySelector(
    '.comment-text'
  ).textContent =
    String(text);


  commentsFeed.appendChild(
    element
  );


  requestAnimationFrame(function(){

    commentsFeed.scrollTo({

      top:
        commentsFeed.scrollHeight,

      behavior:
        'smooth'

    });

  });

}


/* =====================================================
   GET CELL VALUE
===================================================== */

function getCellValue(

  cells,

  index

){

  if(
    index === -1 ||
    !cells[index] ||
    cells[index].v === undefined ||
    cells[index].v === null
  ){

    return '';

  }


  return String(
    cells[index].v
  ).trim();

}


/* =====================================================
   FIND COLUMN
===================================================== */

function findColumn(

  headers,

  possibleNames

){

  return headers.findIndex(

    function(header){

      const clean =
        String(header || '')
          .trim()
          .toLowerCase()
          .replace(/\s+/g,' ');


      return possibleNames.includes(
        clean
      );

    }

  );

}


/* =====================================================
   LOAD COMMENTS
===================================================== */

async function loadComments(){

  try{

    const url =
      `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:json&headers=1&tq=${encodeURIComponent('select *')}`;


    const response =
      await fetch(

        url,

        {
          cache:'no-store'
        }

      );


    if(!response.ok){

      throw new Error(
        'Google Sheet request failed'
      );

    }


    const raw =
      await response.text();


    const start =
      raw.indexOf('{');


    const end =
      raw.lastIndexOf('}');


    if(
      start === -1 ||
      end === -1
    ){

      throw new Error(
        'Invalid Google Sheet response'
      );

    }


    const json =
      JSON.parse(

        raw.substring(
          start,
          end + 1
        )

      );


    const columns =
      json.table.cols || [];


    const rows =
      json.table.rows || [];


    const headers =
      columns.map(

        function(column){

          return String(
            column.label || ''
          )
          .trim()
          .toLowerCase();

        }

      );


    console.log(
      'Sheet columns:',
      headers
    );


    /*
       Find NAME.
    */

    let nameIndex =
      findColumn(

        headers,

        [
          'name',
          'username',
          'user',
          'full name',
          'fullname',
          'display name'
        ]

      );


    /*
       Find COMMENT.
    */

    let commentIndex =
      findColumn(

        headers,

        [
          'comment',
          'comments',
          'comment text',
          'message',
          'text',
          'response',
          'reply'
        ]

      );


    /*
       Detect timestamp only so we can
       SKIP it.
    */

    const timestampIndex =
      findColumn(

        headers,

        [
          'timestamp',
          'time',
          'date',
          'datetime',
          'date/time',
          'submitted at',
          'submission time'
        ]

      );


    /*
       Google Form style:

       Timestamp | Name | Comment
    */

    if(
      nameIndex === -1 &&
      timestampIndex === 0 &&
      columns.length >= 3
    ){

      nameIndex = 1;

    }


    if(
      commentIndex === -1 &&
      timestampIndex === 0 &&
      columns.length >= 3
    ){

      commentIndex = 2;

    }


    /*
       Name | Comment
    */

    if(
      nameIndex === -1 &&
      columns.length >= 2
    ){

      nameIndex = 0;

    }


    if(
      commentIndex === -1 &&
      columns.length >= 2
    ){

      /*
         If first column is timestamp,
         don't accidentally use it.
      */

      if(
        nameIndex === 0 &&
        timestampIndex !== 0
      ){

        commentIndex = 1;

      }

    }


    console.log(
      'Name index:',
      nameIndex
    );

    console.log(
      'Comment index:',
      commentIndex
    );

    console.log(
      'Timestamp index:',
      timestampIndex
    );


    if(commentIndex === -1){

      throw new Error(
        'Comment column could not be found'
      );

    }


    /*
       Build comments array.
    */

    comments = [];


    rows.forEach(

      function(row){

        const cells =
          row.c || [];


        let displayName =
          getCellValue(

            cells,

            nameIndex

          );


        if(!displayName){

          displayName =
            'Attendee';

        }


        const commentText =
          getCellValue(

            cells,

            commentIndex

          );


        if(
          commentText &&
          commentText.trim()
        ){

          comments.push({

            name:
              displayName,

            text:
              commentText

          });

        }

      }

    );


    console.log(
      'Total comments:',
      comments.length
    );


    /*
       RESTORE COMMENT POSITION.

       This is the important part.

       If viewer previously saw comments
       1 through 15, currentCommentIndex
       becomes 15.

       It will start at comment 16.
    */

    currentCommentIndex =
      getSavedCommentProgress();


    /*
       Protect against old saved index
       being larger than the current Sheet.
    */

    if(
      currentCommentIndex >
      comments.length
    ){

      currentCommentIndex =
        comments.length;

    }


    /*
       Instantly redraw every comment the
       viewer already saw, so the feed
       isn't empty after a refresh.
    */

    restorePastComments();


    /*
       Start from saved comment.
    */

    startCommentSequence();

  }
  catch(error){

    console.error(
      'COMMENTS ERROR:',
      error
    );

  }

}


/* =====================================================
   STOP COMMENTS

   Called when the video/live session
   ends. No further comments should
   appear after this.
===================================================== */

function stopComments(){

  commentsStopped = true;


  if(commentTimer){

    clearTimeout(
      commentTimer
    );

    commentTimer = null;

  }

}


/* =====================================================
   RESTORE PAST COMMENTS

   Instantly redraw every comment already
   shown before this refresh, so the feed
   isn't empty until the next new one.
===================================================== */

function restorePastComments(){

  for(
    let i = 0;
    i < currentCommentIndex;
    i++
  ){

    if(comments[i]){

      addComment(

        comments[i].name,

        comments[i].text,

        'Attendee'

      );

    }

  }

}


/* =====================================================
   COMMENT SEQUENCE
===================================================== */

function startCommentSequence(){

  /*
     Live session already ended —
     don't start the sequence at all.
  */

  if(commentsStopped){

    return;

  }


  /*
     Clear any previous timer.
  */

  if(commentTimer){

    clearTimeout(
      commentTimer
    );

  }


  /*
     No comments.
  */

  if(
    !comments.length
  ){

    return;

  }


  /*
     If all comments have already been
     shown, don't start from the beginning.
  */

  if(
    currentCommentIndex >=
    comments.length
  ){

    return;

  }


  /*
     Show the next comment.
  */

  showNextComment();

}


/* =====================================================
   SHOW NEXT COMMENT
===================================================== */

function showNextComment(){

  if(commentsStopped){

    return;

  }


  if(
    currentCommentIndex >=
    comments.length
  ){

    saveCommentProgress();

    return;

  }


  const comment =
    comments[currentCommentIndex];


  /*
     Show ONLY:

     NAME
     COMMENT

     No timestamp.
  */

  addComment(

    comment.name,

    comment.text,

    'Attendee'

  );


  /*
     Move index forward immediately.

     Therefore, if the user minimises
     right now, the next comment will be
     the next one when they return.
  */

  currentCommentIndex++;


  saveCommentProgress();


  /*
     Wait before next comment.

     2.5 seconds.
  */

  commentTimer =
    setTimeout(

      showNextComment,

      500

    );

}


/* =====================================================
   LOAD COMMENTS
===================================================== */

loadComments();


/* =====================================================
   USER COMMENT
===================================================== */

function postComment(){

  const text =
    commentInput.value.trim();


  if(!text){

    return;

  }


  const displayName =
    name
      ? name.split(' ')[0]
      : 'You';


  addComment(

    displayName,

    text,

    'Attendee'

  );


  commentInput.value = '';

  commentInput.focus();

}


/* =====================================================
   SEND BUTTON
===================================================== */

document
  .getElementById(
    'commentBtn'
  )
  .addEventListener(

    'click',

    postComment

  );


/* =====================================================
   ENTER
===================================================== */

commentInput.addEventListener(

  'keydown',

  function(event){

    if(
      event.key === 'Enter'
    ){

      event.preventDefault();

      postComment();

    }

  }

);

</script>
